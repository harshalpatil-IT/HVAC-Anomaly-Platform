<div class="login-page">

    <div class="overlay"></div>

    <div class="login-wrapper">

        <div class="branding-section">

            <div class="logo-circle">

                ❄️

            </div>

            <h1>HVAC Anomaly Platform</h1>

            <p>
                Intelligent HVAC Monitoring & Device Management
            </p>

        </div>

        <mat-card class="login-card">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to continue
            </p>

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Username</mat-label>

                <input
                    matInput
                    [(ngModel)]="username"
                    placeholder="Enter username">

            </mat-form-field>

            <mat-form-field
                appearance="outline"
                class="full-width">

                <mat-label>Password</mat-label>

                <input
                    matInput
                    [type]="hidePassword ? 'password' : 'text'"
                    [(ngModel)]="password"
                    placeholder="Enter password">

                <button
                    mat-icon-button
                    matSuffix
                    type="button"
                    (click)="hidePassword = !hidePassword">

                    <mat-icon>
                        {{ hidePassword ? 'visibility_off' : 'visibility' }}
                    </mat-icon>

                </button>

            </mat-form-field>

            <p
                class="error-text"
                *ngIf="errorMessage">

                {{ errorMessage }}

            </p>

            <button
                mat-raised-button
                class="login-button"
                (click)="login()">

                Login

            </button>

        </mat-card>

    </div>

</div>
